<!DOCTYPE html>
<html>
<head>
    <title>CSS Types</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Internal CSS -->
    <style>
        input {
            border: 2px solid blue;
        }

        .contact {
            color: green;
        }
    </style>
</head>

<body>

    <form class="contact">

        <h2>Contact Form</h2>

        <!-- Inline CSS -->
        <input type="text"
               placeholder="Name"
               style="background-color: lightyellow;">

        <br><br>

        <input type="email"
               placeholder="Email">

        <br><br>

        <button>Submit</button>

    </form>

</body>
</html>
