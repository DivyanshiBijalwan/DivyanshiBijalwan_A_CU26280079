<!DOCTYPE html>
<html>
<head>
    <title>Student Form</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
        }

        form {
            width: 400px;
            margin: 30px auto;
            padding: 25px;
            background: white;
            border-radius: 10px;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        input, select, textarea {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }

        input[type="radio"],
        input[type="checkbox"] {
            width: auto;
        }

        input[type="submit"] {
            margin-top: 20px;
            background-color: #333;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>Student Form</h1>

    <form>
        <label>Name:</label>
        <input type="text">

        <label>Password:</label>
        <input type="password">

        <label>Gender:</label>
        <input type="radio" name="gender"> Male
        <input type="radio" name="gender"> Female

        <label>Hobbies:</label>
        <input type="checkbox"> Reading
        <input type="checkbox"> Music

        <label>City:</label>
        <select>
            <option>Haridwar</option>
            <option>Dehradun</option>
            <option>Delhi</option>
        </select>

        <label>Address:</label>
        <textarea rows="4"></textarea>

        <input type="submit" value="Submit">
    </form>

</body>
</html>
