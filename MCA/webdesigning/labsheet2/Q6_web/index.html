<!DOCTYPE html>
<html>
<head>
    <title>Grid Form</title>

    <style>
        form {
            width: 600px;
            margin: 30px auto;
            display: grid;
            grid-template-columns: 150px 1fr;
            gap: 15px;
        }

        input, select {
            padding: 8px;
        }

        button {
            grid-column: 2;
            padding: 10px;
        }
    </style>
</head>

<body>

    <h1>Registration Form</h1>

    <form>

        <label>Name:</label>
        <input type="text">

        <label>Email:</label>
        <input type="email">

        <label>City:</label>
        <select>
            <option>Haridwar</option>
            <option>Delhi</option>
        </select>

        <button>Submit</button>

    </form>

</body>
</html>
