<!DOCTYPE html>
<html>
<head>
    <title>Newsletter Subscription</title>

    <style>
        body {
            font-family: Arial;
        }

        .newsletter {
            width: 350px;
            margin: 80px auto;
        }

        .input-group {
            position: relative;
            margin: 30px 0;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #777;
            box-sizing: border-box;
            outline: none;
        }

        .input-group label {
            position: absolute;
            left: 10px;
            top: 12px;
            background-color: white;
            padding: 0 5px;
            color: #777;
            transition: 0.3s;
        }

        .input-group input:focus + label,
        .input-group input:not(:placeholder-shown) + label {
            top: -10px;
            font-size: 12px;
            color: #333;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="newsletter">

        <h2>Subscribe to Newsletter</h2>

        <div class="input-group">

            <input type="email"
                   id="email"
                   placeholder=" ">

            <label for="email">
                Email Address
            </label>

        </div>

        <button>Subscribe</button>

    </div>

</body>
</html>
