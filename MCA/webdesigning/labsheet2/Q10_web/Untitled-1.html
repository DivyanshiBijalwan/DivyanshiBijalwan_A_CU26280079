<!DOCTYPE html>
<html>
<head>
    <title>Data Entry Table</title>

    <style>
        form {
            width: 600px;
            margin: 30px auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            border: 1px solid #aaa;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        tr:hover {
            background-color: #ddd;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 6px;
        }
    </style>
</head>

<body>

    <form>

        <h2>Student Data</h2>

        <table>

            <tr>
                <th>Name</th>
                <th>Course</th>
                <th>Marks</th>
            </tr>

            <tr>
                <td><input type="text"></td>
                <td><input type="text"></td>
                <td><input type="number"></td>
            </tr>

            <tr>
                <td><input type="text"></td>
                <td><input type="text"></td>
                <td><input type="number"></td>
            </tr>

        </table>

    </form>

</body>
</html>
