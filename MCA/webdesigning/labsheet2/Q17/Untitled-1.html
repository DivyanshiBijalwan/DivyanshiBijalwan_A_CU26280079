<!DOCTYPE html>
<html>
<head>
    <title>Hidden Input</title>

    <style>
        form {
            width: 400px;
            margin: 50px auto;
        }

        input[type="text"] {
            padding: 10px;
            width: 100%;
            box-sizing: border-box;
        }

        input[type="submit"] {
            margin-top: 15px;
            padding: 10px 20px;
        }
    </style>
</head>

<body>

    <form action="submit.php" method="post">

        <h2>User Form</h2>

        <input type="text"
               name="username"
               placeholder="Enter Username">

        <input type="hidden"
               name="session_id"
               value="USER12345">

        <input type="hidden"
               name="page"
               value="registration">

        <br>

        <input type="submit" value="Submit">

    </form>

</body>
</html>
