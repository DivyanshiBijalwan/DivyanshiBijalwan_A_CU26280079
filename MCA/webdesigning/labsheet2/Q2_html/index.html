<!DOCTYPE html>
<html>

<head>
    <title>Student Registration</title>
</head>

<body>

    <h2>Student Registration</h2>

    <form>

        Name:
        <input type="text"
               required
               minlength="3"
               maxlength="30"
               pattern="[A-Za-z ]+">
        <br><br>

        Email:
        <input type="email" required>
        <br><br>

        Password:
        <input type="password"
               required
               minlength="6">
        <br><br>

        Age:
        <input type="number"
               min="18"
               max="30"
               required>
        <br><br>

        <button type="submit">Register</button>

    </form>

</body>

</html>
