<!DOCTYPE html>
<html>
<head>
    <title>File Upload</title>

    <style>
        body {
            font-family: Arial;
        }

        form {
            width: 400px;
            margin: 50px auto;
        }

        .submit-btn {
            padding: 12px 25px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 5px;
            transition: 0.3s;
            cursor: pointer;
        }

        .submit-btn:hover {
            background-color: #555;
            transform: scale(1.05);
        }

        .submit-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>

<body>

    <form>

        <h2>Upload File</h2>

        <input type="file">

        <br><br>

        <button class="submit-btn">Upload</button>

    </form>

</body>
</html>
