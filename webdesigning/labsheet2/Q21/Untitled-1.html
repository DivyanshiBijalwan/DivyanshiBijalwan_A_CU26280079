<!DOCTYPE html>
<html>
<head>
    <title>Accessible Form</title>

    <style>
        form {
            width: 400px;
            margin: 30px auto;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
        }

        input[type="submit"] {
            margin-top: 20px;
            background-color: #333;
            color: white;
            border: none;
        }
    </style>
</head>

<body>

    <h1>Accessible Registration Form</h1>

    <form>

        <label for="name">Full Name:</label>
        <input type="text"
               id="name"
               name="name">

        <label for="email">Email:</label>
        <input type="email"
               id="email"
               name="email">

        <label for="password">Password:</label>
        <input type="password"
               id="password"
               name="password">

        <label for="dob">Date of Birth:</label>
        <input type="date"
               id="dob"
               name="dob">

        <input type="submit"
               value="Register">

    </form>

</body>
</html>
