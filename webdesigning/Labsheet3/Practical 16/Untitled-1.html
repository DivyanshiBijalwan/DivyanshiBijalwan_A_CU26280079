<!DOCTYPE html>
<html>
<head>
    <title>Image Gallery</title>

    <style>
        #gallery {
            width: 400px;
            height: 250px;
            object-fit: cover;
        }

        button {
            padding: 10px 20px;
            margin: 10px;
        }
    </style>
</head>

<body>

    <h2>Image Gallery</h2>

    <img id="gallery"
         src="https://picsum.photos/id/10/400/250"
         alt="Gallery Image">

    <br>

    <button onclick="previous()">Previous</button>
    <button onclick="next()">Next</button>

    <script>
        let images = [
            "https://picsum.photos/id/10/400/250",
            "https://picsum.photos/id/20/400/250",
            "https://picsum.photos/id/30/400/250",
            "https://picsum.photos/id/40/400/250"
        ];

        let index = 0;

        function showImage() {
            document.getElementById("gallery").src = images[index];
        }

        function next() {
            index++;

            if (index >= images.length) {
                index = 0;
            }

            showImage();
        }

        function previous() {
            index--;

            if (index < 0) {
                index = images.length - 1;
            }

            showImage();
        }
    </script>

</body>
</html>
